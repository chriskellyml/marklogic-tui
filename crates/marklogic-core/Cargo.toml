[package]
name = "marklogic-core"
version = "0.1.0"
edition = "2024"

[features]
# Used by consumers' dev-dependencies to keep configuration writes isolated.
test-support = []
logs = ["dep:ratatui", "dep:rusqlite"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
digest_auth = "0.3"
dirs = "6"
flate2 = "1"
regex = "1"
quick-xml = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
url = "2"
urlencoding = "2.1.3"
unicode-width = "0.2"
ratatui = { version = "0.30", default-features = false, optional = true }
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "hooks"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
