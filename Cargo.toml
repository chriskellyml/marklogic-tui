[package]
name = "marklogic-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
dirs = "6"
toml = "0.8"
anyhow = "1"
digest_auth = "0.3"
ratatui-textarea = "0.8"
url = "2"
urlencoding = "2.1.3"
edtui = { version = "0.11", features = ["syntax-highlighting"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
quick-xml = "0.39"
unicode-width = "0.2"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "time"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
