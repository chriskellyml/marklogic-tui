[package]
name = "marklogic-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "marklogic_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
marklogic-core = { path = "../../crates/marklogic-core", features = ["logs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
marklogic-core = { path = "../../crates/marklogic-core", features = ["test-support"] }
