[package]
name = "marklogic-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "marklogic_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
marklogic-core = { path = "../../crates/marklogic-core", features = ["logs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }

[dev-dependencies]
marklogic-core = { path = "../../crates/marklogic-core", features = ["test-support"] }
