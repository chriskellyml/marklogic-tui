buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'com.marklogic:ml-gradle:6.1.0' }
}
apply plugin: 'com.marklogic.ml-gradle'
repositories { mavenCentral() }
configurations { mlcp }
dependencies {
    mlcp 'com.marklogic:mlcp:12.0.1'
    mlcp 'ch.qos.logback:logback-classic:1.5.32'
}
tasks.register('transfer', com.marklogic.gradle.task.MlcpTask) {
    classpath = configurations.mlcp
    systemProperty 'logback.configurationFile', file('logback.xml').absolutePath
    command = System.getenv('WORKBENCH_MLCP_COMMAND')
    port = Integer.parseInt(System.getenv('WORKBENCH_MLCP_PORT'))
    options_file = System.getenv('WORKBENCH_MLCP_OPTIONS')
}
